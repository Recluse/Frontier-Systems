[preset.0]
name="Windows Development"
platform="Windows Desktop"
runnable=true
custom_features="first_playable"
export_filter="all_resources"
include_filter="data/**/*.json,LICENSE,THIRD_PARTY_NOTICES.md,addons/**/LICENSE*,addons/**/license*,addons/**/COPYRIGHT*"
exclude_filter="tests/*,tools/*,docs/*,reports/*,services/*,packages/*,var/*,config/local/*,.github/*"
export_path=""

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
debug/export_console_wrapper=1
codesign/enable=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]
name="Linux Development"
platform="Linux"
runnable=false
custom_features="first_playable"
export_filter="all_resources"
include_filter="data/**/*.json,LICENSE,THIRD_PARTY_NOTICES.md,addons/**/LICENSE*,addons/**/license*,addons/**/COPYRIGHT*"
exclude_filter="tests/*,tools/*,docs/*,reports/*,services/*,packages/*,var/*,config/local/*,.github/*"
export_path=""

[preset.1.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
