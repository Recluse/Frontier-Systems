name: Inventory transfer preview
on:
  pull_request:
    branches: [dev-master]
    paths:
      - 'src/presentation/inventory/**'
      - 'tests/godot/player_inventory*'
      - 'tests/godot/client_inventory_shell_test.gd'
      - 'src/app/first_playable_bootstrap.gd'
      - '.github/workflows/inventory-transfer-preview.yml'
  push:
    branches: [inventory-transfer-preview, inventory-transfer-layout]
permissions:
  contents: read
concurrency:
  group: inventory-transfer-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    name: Inventory preview (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Run bounded inventory panel fixtures
        shell: pwsh
        run: ./tools/ci/run-godot-checks.ps1 -TestNames player_inventory_transfer_layout_test.gd,player_inventory_transfer_preview_test.gd,player_inventory_handoffs_test.gd,player_inventory_feedback_test.gd,client_inventory_shell_test.gd -TestTimeoutSeconds 120
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: inventory-preview-${{ matrix.os }}
          path: var/ci/godot/
          retention-days: 3
