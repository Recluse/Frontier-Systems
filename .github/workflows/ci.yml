name: CI

on:
  pull_request:
    branches:
      - dev-master
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP quality (PHP ${{ matrix.php-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            php-version: '8.3'
          - os: ubuntu-latest
            php-version: '8.5'
          - os: windows-latest
            php-version: '8.3'
    defaults:
      run:
        working-directory: services/control-plane
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Enforce PSR-4 mappings
        run: composer dump-autoload --optimize --strict-psr --strict-ambiguous

      - name: Enforce Windows-compatible runtime APIs
        run: php ../../tools/check-windows-runtime-policy.php

      - name: Check PHP formatting
        if: matrix.php-version == '8.3'
        run: composer cs-check

      - name: Run PHP unit suite
        run: composer unit

      - name: Check optional Twitch adapters without live credentials
        run: php vendor/phpunit/phpunit/phpunit --bootstrap ../../packages/twitch/tests/bootstrap.php ../../packages/twitch/tests

      - name: Audit locked dependencies
        if: matrix.php-version == '8.5' && matrix.os == 'ubuntu-latest'
        env:
          COMPOSER_NO_AUDIT: 'false'
        run: composer audit --locked

      - name: Generate PHP API documentation
        if: matrix.php-version == '8.5' && matrix.os == 'ubuntu-latest'
        run: composer docs

      - name: Build production PHAR
        if: matrix.os == 'windows-latest'
        run: composer phar

  profiling-package:
    name: Profiling package metadata (${{ matrix.package }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        package: [profiling, profiling-http, twitch, server-status]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Validate package metadata
        run: composer validate --strict
      - name: Resolve package production requirements
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress
      - name: Enforce package PSR-4 mappings
        run: composer dump-autoload --optimize --strict-psr --strict-ambiguous

  godot-import:
    name: Godot project import (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import and parse the project headlessly
        run: godot --headless --editor --path . --import --quit

      - name: Start the client-independent runtime headlessly
        run: godot --headless --path . --quit-after 2

      - name: Check cooperative first playable and durable restart continuation
        run: godot --headless --xr-mode off --path . --script res://tests/godot/first_playable_acceptance.gd

      - name: Check machine module import and compatibility contracts
        run: godot --headless --path . --script res://tests/godot/machine_module_contracts_test.gd

      - name: Check terrain material conservation and contracts
        run: godot --headless --path . --script res://tests/godot/terrain_material_contracts_test.gd

      - name: Check body inventory equipment profiles
        run: godot --headless --path . --script res://tests/godot/inventory_equipment_profile_test.gd

      - name: Check inventory ownership and nested container limits
        run: godot --headless --path . --script res://tests/godot/inventory_ledger_test.gd

      - name: Check body equipment and active-hand transactions
        run: godot --headless --path . --script res://tests/godot/body_inventory_state_test.gd

      - name: Check other-body inventory interaction policy
        run: godot --headless --path . --script res://tests/godot/body_inventory_interaction_policy_test.gd

      - name: Check timed inventory interaction jobs and recovery
        run: godot --headless --path . --script res://tests/godot/body_inventory_interaction_job_test.gd

      - name: Check shared inventory transactions and completion receipts
        run: godot --headless --path . --script res://tests/godot/shared_inventory_coordinator_test.gd

      - name: Check scoped inventory searches and revocation
        run: godot --headless --path . --script res://tests/godot/inventory_search_views_test.gd

      - name: Check inventory fixed-tick commands and world recovery
        run: godot --headless --path . --script res://tests/godot/inventory_runtime_test.gd

      - name: Check local inventory panel and scoped actions
        run: godot --headless --path . --script res://tests/godot/local_inventory_panel_test.gd

      - name: Check self inventory commands and equipment recovery
        run: godot --headless --path . --script res://tests/godot/self_inventory_runtime_test.gd

      - name: Check world inventory pickup/drop and migration
        run: godot --headless --path . --script res://tests/godot/world_inventory_runtime_test.gd

      - name: Check procedural world inventory preview and selection
        run: godot --headless --path . --script res://tests/godot/world_inventory_preview_test.gd

      - name: Check inventory 3D reach and spatial recovery
        run: godot --headless --path . --script res://tests/godot/inventory_spatial_test.gd

      - name: Check opt-in local capsule inventory bridge
        run: godot --headless --path . --script res://tests/godot/local_inventory_body_adapter_test.gd

      - name: Check gravity generator and EVA locomotion policy
        run: godot --headless --path . --script res://tests/godot/locomotion_environment_policy_test.gd

      - name: Check gas mixtures and prototype breathing policy
        run: godot --headless --path . --script res://tests/godot/gas_mixture_test.gd

      - name: Check consciousness causes and saved recovery policy
        run: godot --headless --xr-mode off --path . --script res://tests/godot/consciousness_policy_test.gd

      - name: Check atomic consciousness ownership and retry recovery
        run: godot --headless --xr-mode off --path . --script res://tests/godot/consciousness_owner_test.gd

      - name: Check health scheduling and persistent world recovery
        run: godot --headless --xr-mode off --path . --script res://tests/godot/health_runtime_test.gd

      - name: Check inventory incapacity and recovery capabilities
        run: godot --headless --xr-mode off --path . --script res://tests/godot/inventory_consciousness_test.gd

      - name: Check localized injuries and health snapshot migration
        run: godot --headless --xr-mode off --path . --script res://tests/godot/body_injury_runtime_test.gd

      - name: Check scoped local health display and lifecycle
        run: godot --headless --xr-mode off --path . --script res://tests/godot/local_health_panel_test.gd

      - name: Check hand traversal and cooperative physical interaction policy
        run: godot --headless --path . --script res://tests/godot/physical_interaction_policy_test.gd

      - name: Check physical grip reservations and paused recovery
        run: godot --headless --path . --script res://tests/godot/physical_grip_owner_test.gd

      - name: Check queued inventory grip arbitration and world recovery
        run: godot --headless --path . --script res://tests/godot/inventory_grip_runtime_test.gd

      - name: Check local grip controls and presentation isolation
        run: godot --headless --path . --script res://tests/godot/local_grip_panel_test.gd

      - name: Check conservative push-off momentum and contact limits
        run: godot --headless --path . --script res://tests/godot/push_off_impulse_test.gd

      - name: Check atomic linear motion and retry recovery
        run: godot --headless --path . --script res://tests/godot/linear_motion_owner_test.gd

      - name: Check optional XR resources and client isolation without hardware
        run: godot --headless --xr-mode off --path . --script res://tests/godot/optional_xr_client_test.gd

      - name: Check XR comfort gates and local preferences without hardware
        run: godot --headless --xr-mode off --path . --script res://tests/godot/xr_comfort_test.gd

      - name: Check spatial XR selection and queued airlock authority without hardware
        run: godot --headless --xr-mode off --path . --script res://tests/godot/xr_spatial_controls_test.gd

      - name: Check manual door operation and degraded equipment
        run: godot --headless --path . --script res://tests/godot/manual_airlock_operation_test.gd

      - name: Check circuit and board-work snapshot recovery
        run: godot --headless --path . --script res://tests/godot/control_runtime_recovery_test.gd

      - name: Check alarm indicator and procedural audio
        run: godot --headless --audio-driver Dummy --path . --script res://tests/godot/alarm_presentation_test.gd

      - name: Check overlay themes and client isolation
        run: godot --headless --path . --script res://tests/godot/overlay_theme_test.gd

      - name: Check overlay layouts and registered panels
        run: godot --headless --path . --script res://tests/godot/overlay_layout_test.gd

      - name: Check HUD section customization and preference recovery
        run: godot --headless --path . --script res://tests/godot/overlay_section_test.gd

      - name: Check procedural habitat and camera presentation
        run: godot --headless --audio-driver Dummy --path . --script res://tests/godot/habitat_preview_test.gd

      - name: Check local character collisions and camera modes
        run: godot --headless --audio-driver Dummy --path . --script res://tests/godot/local_character_navigation_test.gd

      - name: Set up PHP for local telemetry integration
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install receiver runtime dependencies
        run: composer install --working-dir=services/control-plane --no-dev --prefer-dist --no-interaction --no-progress

      - name: Check default local profiling configuration end to end
        shell: pwsh
        run: ./tools/test-local-profiling.ps1
