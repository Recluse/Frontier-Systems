name: CI

on:
  pull_request:
    branches:
      - dev-master
  push:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP quality (PHP ${{ matrix.php-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            php-version: '8.3'
          - os: ubuntu-latest
            php-version: '8.5'
          - os: windows-latest
            php-version: '8.3'
    defaults:
      run:
        working-directory: services/control-plane
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Locate Composer download cache
        id: composer-cache
        shell: pwsh
        run: '"path=$(composer config --global cache-files-dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('services/control-plane/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php-version }}-

      - name: Install locked dependencies
        if: runner.os != 'Windows'
        run: composer install --prefer-dist --no-interaction --no-progress

      # phpDocumentor's optional PHAR distributor needs GPG import unavailable
      # on this Windows runner. Documentation generation runs in verified Linux CI.
      - name: Install locked dependencies on Windows without documentation plugin
        if: runner.os == 'Windows'
        run: composer install --no-plugins --prefer-dist --no-interaction --no-progress

      - name: Enforce PSR-4 mappings
        run: composer dump-autoload --optimize --strict-psr --strict-ambiguous

      - name: Enforce Windows-compatible runtime APIs
        run: php ../../tools/check-windows-runtime-policy.php

      - name: Check PHP formatting
        if: matrix.php-version == '8.3'
        run: composer cs-check

      - name: Run PHP unit suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../../var/ci/php | Out-Null
          php vendor/phpunit/phpunit/phpunit --testdox --log-junit ../../var/ci/php/control-plane.xml
          if ($LASTEXITCODE -ne 0) { throw 'Control-plane tests failed.' }
          php vendor/phpunit/phpunit/phpunit --bootstrap ../../packages/event-logging/tests/bootstrap.php ../../packages/event-logging/tests --log-junit ../../var/ci/php/event-logging.xml
          if ($LASTEXITCODE -ne 0) { throw 'Event logging tests failed.' }

      - name: Check optional Twitch adapters without live credentials
        run: php vendor/phpunit/phpunit/phpunit --bootstrap ../../packages/twitch/tests/bootstrap.php ../../packages/twitch/tests --log-junit ../../var/ci/php/twitch.xml

      - name: Audit locked dependencies
        if: matrix.php-version == '8.5' && matrix.os == 'ubuntu-latest'
        env:
          COMPOSER_NO_AUDIT: 'false'
        run: composer audit --locked

      - name: Generate PHP API documentation
        if: matrix.php-version == '8.5' && matrix.os == 'ubuntu-latest'
        run: composer docs

      - name: Build production PHAR
        if: matrix.php-version == '8.3'
        run: composer phar

      - name: Upload PHP test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-tests-${{ matrix.os }}-${{ matrix.php-version }}
          path: var/ci/php/
          retention-days: 3
          if-no-files-found: warn

      - name: Upload production control-plane PHAR
        if: success() && matrix.php-version == '8.3'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: control-plane-${{ matrix.os }}
          path: services/control-plane/bin/build/control-plane.phar
          retention-days: 3
          if-no-files-found: error

      - name: Upload generated PHP API documentation
        if: success() && matrix.php-version == '8.5'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-api-docs
          path: docs/generated/php-api/
          retention-days: 3
          if-no-files-found: error

  php-packages:
    name: PHP package contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Locate Composer download cache
        id: composer-cache
        shell: pwsh
        run: '"path=$(composer config --global cache-files-dir)" >> $env:GITHUB_OUTPUT'
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: composer-packages-${{ runner.os }}-${{ hashFiles('packages/**/composer.json') }}
          restore-keys: composer-packages-${{ runner.os }}-
      - name: Validate every package and PSR-4 map
        shell: pwsh
        run: |
          $packages = Get-ChildItem packages -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'composer.json') }
          if (@($packages).Count -eq 0) { throw 'No Composer packages discovered.' }
          foreach ($package in $packages) {
            composer --working-dir=$($package.FullName) validate --strict
            if ($LASTEXITCODE -ne 0) { throw "Invalid metadata: $($package.Name)" }
            composer --working-dir=$($package.FullName) install --no-dev --prefer-dist --no-interaction --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Cannot resolve production dependencies: $($package.Name)" }
            composer --working-dir=$($package.FullName) dump-autoload --optimize --strict-psr --strict-ambiguous
            if ($LASTEXITCODE -ne 0) { throw "Invalid PSR-4 mapping: $($package.Name)" }
          }

  godot-import:
    name: Godot project import (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Discover and run bounded headless checks
        shell: pwsh
        run: ./tools/ci/run-godot-checks.ps1

      - name: Check strict operator launch options and bounded native CLI
        shell: pwsh
        run: ./tools/ci/test-checkpoint-operator.ps1 -Godot 'godot'

      - name: Upload Godot diagnostics and JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: godot-tests-${{ matrix.os }}
          path: var/ci/godot/
          retention-days: 3
          if-no-files-found: warn

      - name: Set up PHP for local telemetry integration
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install receiver runtime dependencies
        run: composer install --working-dir=services/control-plane --no-dev --prefer-dist --no-interaction --no-progress

      - name: Check default local profiling configuration end to end
        shell: pwsh
        run: ./tools/test-local-profiling.ps1

      - name: Check authenticated game event ingestion without Discord sends
        shell: pwsh
        run: ./tools/test-event-logging.ps1

  game-export:
    name: Development export (${{ matrix.platform }})
    needs: [php-quality, php-packages, godot-import]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pinned Godot with export templates
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Export, start the packaged host and create checksummed archive
        shell: pwsh
        run: ./tools/ci/build-development-export.ps1 -Platform '${{ matrix.platform }}' -Revision '${{ github.sha }}'
      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: export-diagnostics-${{ matrix.platform }}
          path: var/ci/exports/*.log
          retention-days: 3
          if-no-files-found: warn
      - name: Upload verified development build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: game-${{ matrix.platform }}-${{ github.sha }}
          path: |
            var/ci/exports/*.zip
            var/ci/exports/*.sha256
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

  required:
    name: CI required
    if: always()
    needs: [php-quality, php-packages, godot-import, game-export]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality and build gate
        shell: pwsh
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          $jobs = $env:RESULTS | ConvertFrom-Json
          foreach ($job in $jobs.PSObject.Properties) {
            if ($job.Value.result -ne 'success') { throw "Required gate $($job.Name) ended as $($job.Value.result)." }
          }
          'All quality, integration and exported-host checks passed.' >> $env:GITHUB_STEP_SUMMARY
